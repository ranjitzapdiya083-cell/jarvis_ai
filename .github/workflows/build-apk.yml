name: Build APK

# When this workflow runs:
#  - Every push to main/master -> builds APKs, uploads as artifacts
#  - Every pull request -> builds APKs to verify nothing is broken
#  - Pushing a tag like "v1.0.0" -> also creates a GitHub Release with the APK attached
#  - Manually, anytime, via the "Run workflow" button (workflow_dispatch)
on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Create local.properties
        # CI has no Android Studio / manual local.properties file, so we
        # generate one pointing at the SDK/Flutter paths the runner already
        # has installed.
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
          echo "flutter.sdk=${FLUTTER_ROOT}" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Run unit tests
        run: flutter test
        continue-on-error: true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs the freshly-built debug APK on a real virtual Android device
  # (an emulator) and captures a screenshot + crash logs — so we can see
  # whether the app actually renders correctly WITHOUT needing your own
  # phone. Check this job's "Artifacts" after every run.
  emulator-check:
    name: Run on Emulator & Capture Screenshot
    needs: build
    # Pinned to macos-13 (Intel-based) rather than macos-latest: GitHub's
    # newer macOS runners are Apple Silicon (arm64), and the x86_64 Android
    # emulator image below cannot use hardware acceleration there, which
    # causes a boot timeout. macos-13 keeps the reliable Intel + x86_64
    # combination that this emulator action is best tested with.
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download debug APK from the build job
        uses: actions/download-artifact@v4
        with:
          name: jarvis-ai-debug-apk
          path: ./apk

      - name: Boot emulator, install app, capture screenshot + logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb install -r ./apk/app-debug.apk

            # Pre-grant permissions so a system permission dialog doesn't
            # sit on top of the home screen and hide it from the screenshot.
            adb shell pm grant com.jarvis.ai android.permission.RECORD_AUDIO || true
            adb shell pm grant com.jarvis.ai android.permission.POST_NOTIFICATIONS || true

            # Clear old logs, then launch the app fresh.
            adb logcat -c
            adb shell monkey -p com.jarvis.ai -c android.intent.category.LAUNCHER 1

            # Give the app time to fully start and render.
            sleep 20

            adb exec-out screencap -p > home_screen.png
            adb logcat -d > logcat.txt

            # Fails this job loudly if the app isn't actually in the
            # foreground after 20s (e.g. it crashed on launch) — so a
            # crash shows up as a red ❌ instead of silently producing an
            # empty/black screenshot that looks like it "worked".
            adb shell dumpsys activity activities | grep -q "com.jarvis.ai" && echo "App is running." || (echo "App is NOT in the foreground — it likely crashed on launch. Check logcat.txt." && exit 1)

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-emulator-screenshot
          path: home_screen.png
          retention-days: 30

      - name: Upload crash/debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-emulator-logcat
          path: logcat.txt
          retention-days: 30
